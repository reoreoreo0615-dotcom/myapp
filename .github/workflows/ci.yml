name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # phpunit.xml (app/phpunit.xml) は DB_HOST=db を既定値にしているが、
    # force 属性を付けていないため、ジョブ側で既に環境変数が設定されていれば
    # そちらが優先される(PHPUnit の PhpHandler::handleEnvVariables の挙動)。
    # そのため、ここで DB_HOST を 127.0.0.1(サービスコンテナへのホスト側アクセス先)
    # に上書きしておけば、Docker 内で使う "db" という値と衝突しない。
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: myapp_testing
      DB_USERNAME: root
      DB_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myapp_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, xml, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        working-directory: app
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Copy .env
        working-directory: app
        run: cp .env.example .env

      - name: Generate application key
        working-directory: app
        run: php artisan key:generate

      - name: Check code style (Pint)
        working-directory: app
        run: ./vendor/bin/pint --test

      # JS/Vue の lint(ESLint + Prettier のチェックのみ)。
      # PHP の Pint と同様、ビルドより前に置く(#5 / #25 の教訓)。
      - name: Lint JS/Vue (ESLint + Prettier)
        working-directory: app
        run: npm run lint:js

      - name: Build frontend assets
        working-directory: app
        run: npm run build

      # ビルド成果物(public/build/manifest.json)が無いと Inertia のページ描画で
      # 「Vite manifest not found」になり Feature テストが落ちる。必ず build の後に実行する。
      - name: Run tests
        working-directory: app
        run: php artisan test

      # JSテスト(Vitest)は Vue コンポーネントのみを対象とし Vite manifest には
      # 依存しないが、PHP テストと同様に build より後に置き、CI 全体の順序を
      # 「lint → build → test」で統一する。
      - name: Run JS tests (Vitest)
        working-directory: app
        run: npm run test:js
