# コンテナ群の記述
services:
  # nginxというサービス
  nginx:
    container_name: myapp-nginx
    image: nginx:latest
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./app:/var/www/html
    ports:
      - "80:80"
    depends_on:
      - php

  php:
    container_name: myapp-laravel
    ###############################################################
    # Mac Apple Silicon(M1/M2以降)で不具合が出る場合は以下を解除
    # platform: linux/x86_64
    ###############################################################
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www/html
      - ./docker/php/check_startup.sh:/tmp/check_startup.sh
    expose:
      - "9000"
    depends_on:
      - db

  db:
    container_name: myapp-db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
      TZ: 'Asia/Tokyo'
    volumes:
      - ./db:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    command: --default-authentication-plugin=mysql_native_password

  phpMyAdmin:
    container_name: myapp-phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - db
    ports:
      - 4040:80
    volumes:
      - ./phpmyadmin/sessions:/sessions
